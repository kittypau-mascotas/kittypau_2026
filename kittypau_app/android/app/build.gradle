apply plugin: 'com.android.application'
// Widget de Android (Knowledge/29_Specs/010-widget-android-hero/research.md
// Decisión 1: Jetpack Glance en vez de RemoteViews clásico) -- primer código
// Kotlin de este módulo, hasta ahora 100% Java (MainActivity.java).
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace "com.kittypau.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kittypau.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Mismos valores públicos que ya usa el WebView vía
        // NEXT_PUBLIC_SUPABASE_URL/NEXT_PUBLIC_SUPABASE_ANON_KEY (kittypau_app/.env.local,
        // NUNCA commiteado -- ver CLAUDE.md) -- `WidgetAuthBridge.kt` los
        // necesita porque corre fuera del WebView/JS, no puede leer
        // `process.env`. El anon key de Supabase está diseñado para vivir en
        // clientes (protegido por RLS, no por secreto) -- igual se pasa por
        // Gradle property (`-PsupabaseUrl=... -PsupabaseAnonKey=...` o
        // `gradle.properties` local, no commiteado) en vez de hardcodearlo
        // acá, para no duplicar el valor real a mano ni atarlo a un único
        // ambiente (dev/staging/prod).
        buildConfigField "String", "SUPABASE_URL",
            "\"${project.findProperty('supabaseUrl') ?: ''}\""
        buildConfigField "String", "SUPABASE_ANON_KEY",
            "\"${project.findProperty('supabaseAnonKey') ?: ''}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // JDK 21, no 17: @capacitor/android 8.5.0 (node_modules, dependencia del
    // proyecto -- módulo :capacitor-android) exige source release 21 en su
    // propio build.gradle. Confirmado real (2026-09-15, build en CI):
    // "invalid source release: 21" al intentar compilar con JDK 17. Antes
    // esto no estaba declarado para :app, Java-only corría con el default
    // del toolchain.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Widget de Android (Knowledge/29_Specs/010-widget-android-hero) --
    // versiones estables más recientes confirmadas contra el repositorio de
    // Google al planificar este feature (2026-09-15); reconfirmar si difiere
    // al compilar por primera vez (research.md § Resumen de dependencias).
    implementation "androidx.glance:glance-appwidget:1.2.0"
    // Verificado (2026-09-15): @capacitor/android 8.5.0 NO trae
    // androidx.work transitiva (grep sin resultados en
    // node_modules/@capacitor/android/capacitor/build.gradle) -- esta
    // declaración explícita es necesaria, no redundante, para el refresco
    // periódico del widget (research.md Decisión 5).
    implementation "androidx.work:work-runtime-ktx:2.11.2"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
