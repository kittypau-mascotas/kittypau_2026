// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // >= 8.9.1 requerido por androidx.activity/core 1.11.0/1.17.0 que trae
        // @capacitor/android 8.5.0 — ver Knowledge/29_Specs/SPEC_06_Mobile_APK_2026.md A1.
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'
        // Widget de Android (Knowledge/29_Specs/010-widget-android-hero) --
        // primer código Kotlin del proyecto (antes solo Java). Versión
        // estable más reciente confirmada contra el Gradle Plugin Portal al
        // planificar este feature (2026-09-15) -- reconfirmar si difiere al
        // compilar por primera vez.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20'
        // Plugin del compilador de Compose -- desde Kotlin 2.0 es un
        // artefacto SEPARADO del kotlin-gradle-plugin de arriba (aunque
        // comparten versión). Glance lo necesita para las funciones
        // @Composable (aplicado como org.jetbrains.kotlin.plugin.compose en
        // app/build.gradle). Faltaba esta línea -- confirmado real
        // (2026-09-15, primer intento de build en CI): "Plugin with id
        // 'org.jetbrains.kotlin.plugin.compose' not found".
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
